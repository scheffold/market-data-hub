# Open Code Review Configuration
# This file is installed to .ocr/config.yaml and customized per-project.
# Context here is injected into every review request.

# ─────────────────────────────────────────────────────────────────────────────
# PROJECT CONTEXT
# ─────────────────────────────────────────────────────────────────────────────
# Injected into ALL review requests. Keep it tight—focus on what reviewers
# genuinely need to know that isn't obvious from the code itself.

context: |
  Tech stack: Python, FastAPI, Pydantic, uv, pytest
  Architecture: HTTP API (:8000) + optional MCP SSE (:8000/mcp) — single port.
    Provider/gateway pattern: registry → ibkr | lseg | finnhub providers.
    All financial values as Decimal. AppError hierarchy maps to HTTP status codes.
  Performance priority: low-latency market data delivery — every hot path matters.
    Providers may be sync (LSEG/refinitiv-data) or async (IBKR/ib_async, Finnhub/httpx).
    External calls must be parallelised where independent; connections must be reused.
  Critical constraints:
    - All financial values MUST use Decimal, never float
    - Provider errors surface via AppError, never raw exceptions
    - httpx pinned at 0.26.0 (uv override) — do not change
    - Lint gate: ruff check app/ must pass before every commit

# ─────────────────────────────────────────────────────────────────────────────
# CONTEXT DISCOVERY
# ─────────────────────────────────────────────────────────────────────────────
# Files to read during Phase 1 (Context Discovery). OCR merges these into
# the review context automatically.

context_discovery:
  # OpenSpec integration - pull project context and active specs
  openspec:
    enabled: true
    config: "openspec/config.yaml"      # Project conventions from OpenSpec
    # config: "openspec/project.md"     # Use this for legacy OpenSpec projects
    specs: "openspec/specs/**/*.md"     # Merged specs for architectural context
    active_changes: "openspec/changes/**/*.md"  # In-flight change proposals
  
  # AI assistant configuration files (auto-detected)
  references:
    - "AGENTS.md"
    - "CLAUDE.md"
    - ".cursorrules"
    - ".windsurfrules"
    - ".github/copilot-instructions.md"
    - "CONTRIBUTING.md"
    - "openspec/AGENTS.md"  # OpenSpec instructions (if present)
  
  # Additional project-specific files to include
  # additional:
  #   - "docs/ARCHITECTURE.md"
  #   - "docs/API_STANDARDS.md"

# ─────────────────────────────────────────────────────────────────────────────
# REVIEW RULES
# ─────────────────────────────────────────────────────────────────────────────
# Per-severity rules for reviewers. Only add what's not obvious.

rules:
  critical:
    - Security vulnerabilities (injection, path traversal, secrets in code)
    - Breaking changes without migration path
    - Financial values handled as float instead of Decimal
    - Provider errors swallowed instead of surfaced via AppError
    - Blocking I/O calls in async context (sync provider called without executor)
  important:
    - Performance regressions in hot paths (provider fetch, quote, news routes)
    - External API calls not parallelised where independent
    - Missing timeouts or retry logic on provider connections
    - Silent error handling (catch without action)
    - httpx pin change (must stay at 0.26.0)
  consider:
    - Naming consistency with existing provider conventions
    - Missing test coverage for provider edge cases (NaN, timeout, bad RIC)
    - Documentation gaps in public API endpoints

# ─────────────────────────────────────────────────────────────────────────────
# REVIEWER TEAM
# ─────────────────────────────────────────────────────────────────────────────

default_team:
  # Calibrated for this repo: FastAPI + MCP + provider/gateway pattern, Python.
  # Core priority: low-latency market data delivery — performance is first-class.
  #
  # Always active — provide architectural depth + redundancy on every PR:
  principal: 2     # Holistic architecture and cross-component impact
  quality: 2       # Readability, maintainability, and implementation quality
  performance: 1   # Hot-path latency, I/O parallelism, caching, N+1, payload size
  #
  # Auto-added by Tech Lead phase (see auto-detection rules in workflow.md):
  #   backend     — FastAPI/Pydantic/service/provider boundary correctness
  #                 → triggered by changes in app/api/, app/providers/, app/services/
  #   reliability — timeouts, retries, fallbacks, error propagation
  #                 → triggered by provider/connection/async changes
  #   security    — API/auth/data handling checks
  #                 → triggered by auth, API, or data handling changes
  #   testing     — coverage depth, edge cases, regression protection
  #                 → triggered by significant logic changes
  # backend: 1
  # reliability: 1
  # security: 1
  # testing: 1

  # ── Optional advanced forms ──
  # Form 2 — object: N instances, all sharing the same model.
  # quality: { count: 2, model: claude-haiku-4-5-20251001 }
  #
  # Form 3 — list of instance configs: per-instance model and optional name.
  # principal:
  #   - { model: claude-opus-4-7 }
  #   - { model: claude-sonnet-4-6, name: principal-balanced }
  #
  # Mixing forms within a single entry (e.g. count + instances) is rejected
  # at parse time. Pick one form per persona.

# ─────────────────────────────────────────────────────────────────────────────
# MODELS (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Define personal aliases for vendor-native model identifiers and an optional
# workspace-level default. OCR ships zero alias entries — this section is
# entirely user-owned. Aliases expand once at parse time.
#
# models:
#   aliases:
#     workhorse: claude-sonnet-4-6
#     big-brain: claude-opus-4-7
#   default: claude-sonnet-4-6   # used when an instance has no explicit model

# ─────────────────────────────────────────────────────────────────────────────
# RUNTIME (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Tunables that affect liveness reasoning. Defaults are usually fine.
#
# runtime:
#   agent_heartbeat_seconds: 60   # After this many seconds without an
#                                  # `ocr session beat` call, a `running`
#                                  # agent_sessions row is reclassified
#                                  # `orphaned` on the next sweep.

# ─────────────────────────────────────────────────────────────────────────────
# CODE REVIEW MAP
# ─────────────────────────────────────────────────────────────────────────────
# Configuration for the /ocr:map command.
# Increase agent redundancy for large codebases to improve accuracy.
# Note: Map is a standalone tool for humans; review command works independently.

# code-review-map:
#   agents:
#     flow_analysts: 2         # Number of Flow Analyst agents (1-10, default: 2)
#     requirements_mappers: 2  # Number of Requirements Mapper agents (1-10, default: 2)

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUT & WORKFLOW
# ─────────────────────────────────────────────────────────────────────────────

output:
  session_dir: ".ocr/sessions"

discourse:
  enabled: true   # Set false or use --quick to skip reviewer debate phase

github:
  auto_prompt_post: false
  comment_format: "single"  # "single" or "inline"
