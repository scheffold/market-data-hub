apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-hub
  labels:
    app: market-data-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data-hub
  template:
    metadata:
      labels:
        app: market-data-hub
    spec:
      containers:
      - name: market-data-hub
        image: market-data-hub:latest
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "prod"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DEFAULT_PRICE_PROVIDER
          value: "ibkr"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
