---
# Market Data Hub - Kubernetes Deployment Manifest
# This file contains all resources needed to deploy to Kubernetes
#
# Prerequisites:
# 1. Create namespace: kubectl create namespace market-data-hub
# 2. Generate the admin encryption key:
#      python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
# 3. Create secrets: kubectl create secret generic market-data-hub-admin \
#      --from-literal=app_encryption_key=$APP_ENCRYPTION_KEY \
#      --from-literal=admin_oidc_client_secret=$ADMIN_OIDC_CLIENT_SECRET \
#      -n market-data-hub
# 4. Back up both this secret and the keys-db PVC. Losing either makes encrypted credentials unrecoverable.
# 5. Apply this file: kubectl apply -f k8s/market-data-hub.yaml -n market-data-hub

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-hub-config
  labels:
    app: market-data-hub
data:
  ibkr_host: "localhost"
  ibkr_port: "4002"
  ibkr_client_id: "815"
  ibkr_market_data_type: "2"
  app_env: "prod"
  log_level: "INFO"
  default_price_provider: "ibkr"
  keys_db_path: "/data/keys.db"
  admin_auth_enabled: "false"
  admin_oidc_issuer: ""
  admin_oidc_client_id: ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-data-hub-keys-db
  labels:
    app: market-data-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-hub
  labels:
    app: market-data-hub
spec:
  replicas: 1  # 1 for dev, 2-3 for production
  selector:
    matchLabels:
      app: market-data-hub
  template:
    metadata:
      labels:
        app: market-data-hub
    spec:
      containers:
      - name: app
        image: ghcr.io/scheffold/market-data-hub:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: sse
        env:
        # IBKR Configuration from ConfigMap
        - name: IBKR_HOST
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: ibkr_host
        - name: IBKR_PORT
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: ibkr_port
        - name: IBKR_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: ibkr_client_id
        - name: IBKR_MARKET_DATA_TYPE
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: ibkr_market_data_type
        # Provider credentials are admin-managed in encrypted SQLite keys.db.
        # Application Settings from ConfigMap
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: app_env
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: log_level
        - name: DEFAULT_PRICE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: default_price_provider
        - name: KEYS_DB_PATH
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: keys_db_path
        - name: ADMIN_AUTH_ENABLED
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: admin_auth_enabled
        - name: ADMIN_OIDC_ISSUER
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: admin_oidc_issuer
        - name: ADMIN_OIDC_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: market-data-hub-config
              key: admin_oidc_client_id
        - name: APP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: market-data-hub-admin
              key: app_encryption_key
        - name: ADMIN_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: market-data-hub-admin
              key: admin_oidc_client_secret
        volumeMounts:
        - name: keys-db
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: keys-db
        persistentVolumeClaim:
          claimName: market-data-hub-keys-db
      # Sidecar container for MCP health monitoring
      - name: mcp-health
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do
              curl -f http://localhost:8001/health || exit 1
              sleep 10
            done
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: market-data-hub
  labels:
    app: market-data-hub
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: sse
  selector:
    app: market-data-hub
