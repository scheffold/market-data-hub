name: Discord Release Notification
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to send notification for (e.g. v1.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release data
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          data=$(gh release view "$RELEASE_TAG" --json name,body,url)
          name=$(printf '%s' "$data" | jq -r '.name // empty')
          url=$(printf '%s' "$data" | jq -r '.url')
          {
            echo "name=$name"
            echo "url=$url"
            echo "body<<__RELEASE_BODY__"
            printf '%s' "$data" | jq -r '.body'
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Market Data Hub Release Bot"
          avatar_url: "https://cdn.discordapp.com/avatars/487431320314576937/bd64361e4ba6313d561d54e78c9e7171.png"
          content: "||@everyone||"
          footer_title: "Changelog"
          reduce_headings: true
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
