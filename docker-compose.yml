services:
  market-data-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: market-data-hub:latest
    ports:
      - "${APP_PORT:-9000}:${APP_PORT:-9000}"
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-9000}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      KEYS_DB_PATH: /app/data/keys.db
  
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-false}
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-}
      ADMIN_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-}
      ADMIN_OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-}


    volumes:
      - keys-db:/app/data
      # Dev: bind app/ from host so Python changes take effect after docker-compose restart (no --build).
      - ./app:/app/app
      # Dev: bind built admin bundle from host.
      # Run `cd admin && npm run build:watch` once; browser reload picks up changes without docker rebuild.
      - ./admin/dist:/app/static/admin
    # command is inherited from Dockerfile (uv run python -m app.main)
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -f http://localhost:${APP_PORT:-9000}/health || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - market-data-hub

networks:
  market-data-hub:
    driver: bridge

volumes:
  keys-db:
