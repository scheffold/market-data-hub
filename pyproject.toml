[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data-hub"
version = "1.0.0"
description = "FastAPI data service for market and company data"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "cryptography>=42.0.0",
    "tenacity>=8.2.0",
    "ib_async>=1.0.0",
    "refinitiv-data==1.6.2",
    "schwab-py>=1.5.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "python-dotenv>=1.2.1",
    "scipy>=1.11.3"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Override httpx version to resolve conflict with refinitiv-data (<0.27)
override-dependencies = [
    "httpx==0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that hit external services or require networked dependencies",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html"
]
